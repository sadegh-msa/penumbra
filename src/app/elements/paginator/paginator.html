<a id="paginator-photographer"
   class="photographer"
   href="{{ photographer.url }}"
   title="Photographer: {{ photographer.name }}">
  <pen-icon icon="outline/camera"></pen-icon>
  <span>
    {{ photographer.name }}
  </span>
</a>

<menu>
  <li>
    <button id="paginator-previous" title="Previous">
      <pen-icon icon="outline/arrow-left-2"></pen-icon>
    </button>
  </li>

  <li>
    <button id="paginator-next" title="Next">
      <pen-icon icon="outline/arrow-right-3"></pen-icon>
    </button>
  </li>
</menu>
